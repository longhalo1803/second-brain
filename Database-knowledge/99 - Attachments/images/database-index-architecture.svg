<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%" role="img" aria-labelledby="db-index-title db-index-desc">
  <title id="db-index-title">Database Index Traversal and Physical Storage Access Architecture</title>
  <desc id="db-index-desc">Architectural diagram detailing B+Tree traversal across Buffer Cache and the physical disk storage retrieval paths including Clustered Index, Secondary Index with Bookmark Lookup, and Covering Index.</desc>
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');
      text {
        font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      .font-mono {
        font-family: 'Geist Mono', monospace;
      }
      .font-serif {
        font-family: 'Instrument Serif', Georgia, serif;
      }
    </style>
    <!-- Arrow Markers -->
    <marker id="arrow-sky" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-coral" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f97316"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#a855f7"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="680" fill="#0f172a"/>

  <!-- Top Title Header -->
  <text x="48" y="36" fill="#38bdf8" font-size="10" font-weight="600" class="font-mono" letter-spacing="0.14em">DATABASE STORAGE ENGINE &amp; QUERY EXECUTION ARCHITECTURE</text>
  <text x="48" y="64" fill="#f8fafc" font-size="24" font-weight="400" class="font-serif">B+Tree Index Mechanics &amp; Table Access Pathways</text>

  <!-- ================= TIER 1: QUERY & OPTIMIZER LAYER ================= -->
  <rect x="40" y="88" width="920" height="96" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Zone Label -->
  <rect x="56" y="80" width="224" height="16" rx="2" fill="#0f172a"/>
  <text x="64" y="92" fill="#94a3b8" font-size="8" font-weight="600" class="font-mono" letter-spacing="0.1em">TIER 1: QUERY &amp; OPTIMIZER LAYER</text>

  <!-- Node 1.1: Client SQL -->
  <rect x="60" y="112" width="240" height="56" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="68" y="118" width="36" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <text x="86" y="127" fill="#94a3b8" font-size="7" class="font-mono" text-anchor="middle">SQL</text>
  <text x="114" y="128" fill="#f8fafc" font-size="12" font-weight="600">Client Query Request</text>
  <text x="68" y="152" fill="#38bdf8" font-size="9" class="font-mono">SELECT * WHERE dept_id = 10 AND ...</text>

  <!-- Node 1.2: Cost-based Optimizer -->
  <rect x="360" y="112" width="280" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="368" y="118" width="56" height="12" rx="2" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="396" y="127" fill="#38bdf8" font-size="7" class="font-mono" text-anchor="middle">CBO ENGINE</text>
  <text x="432" y="128" fill="#f8fafc" font-size="12" font-weight="600">Cost-Based SQL Optimizer</text>
  <text x="368" y="152" fill="#94a3b8" font-size="9" class="font-mono">Compare Cost: Index Seek vs Table Scan</text>

  <!-- Node 1.3: Plan Output -->
  <rect x="700" y="112" width="240" height="56" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="708" y="118" width="40" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <text x="728" y="127" fill="#94a3b8" font-size="7" class="font-mono" text-anchor="middle">PLAN</text>
  <text x="756" y="128" fill="#f8fafc" font-size="12" font-weight="600">Index Seek Decision</text>
  <text x="708" y="152" fill="#10b981" font-size="9" class="font-mono">Selectivity &lt; 15% -&gt; Index Route</text>

  <!-- Tier 1 Connectors -->
  <line x1="300" y1="140" x2="352" y2="140" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow-muted)"/>
  <line x1="640" y1="140" x2="692" y2="140" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow-sky)"/>

  <!-- ================= TIER 2: B+TREE INDEX TRAVERSAL IN BUFFER CACHE ================= -->
  <rect x="40" y="208" width="920" height="144" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Zone Label -->
  <rect x="56" y="200" width="312" height="16" rx="2" fill="#0f172a"/>
  <text x="64" y="212" fill="#94a3b8" font-size="8" font-weight="600" class="font-mono" letter-spacing="0.1em">TIER 2: B+TREE TRAVERSAL (BUFFER POOL IN RAM)</text>

  <!-- Node 2.1: Root Node -->
  <rect x="60" y="236" width="220" height="96" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
  <rect x="68" y="244" width="60" height="12" rx="2" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="0.8"/>
  <text x="98" y="253" fill="#38bdf8" font-size="7" class="font-mono" text-anchor="middle">ROOT PAGE</text>
  <text x="68" y="274" fill="#f8fafc" font-size="12" font-weight="600">Level 0: Root Page</text>
  <text x="68" y="292" fill="#94a3b8" font-size="9" class="font-mono">Pinned in RAM (0 Disk I/O)</text>
  <text x="68" y="310" fill="#38bdf8" font-size="9" class="font-mono">Keys: [10 | 50 | 100 | 250]</text>

  <!-- Node 2.2: Branch Nodes -->
  <rect x="360" y="236" width="240" height="96" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <rect x="368" y="244" width="64" height="12" rx="2" fill="none" stroke="#64748b" stroke-width="0.8"/>
  <text x="400" y="253" fill="#94a3b8" font-size="7" class="font-mono" text-anchor="middle">BRANCH PAGE</text>
  <text x="368" y="274" fill="#f8fafc" font-size="12" font-weight="600">Level 1..h-1: Branch Nodes</text>
  <text x="368" y="292" fill="#94a3b8" font-size="9" class="font-mono">Fan-out B ≈ 450 - 1000 keys</text>
  <text x="368" y="310" fill="#cbd5e1" font-size="9" class="font-mono">Child Page Pointers (8KB Page)</text>

  <!-- Node 2.3: Leaf Nodes -->
  <rect x="680" y="236" width="260" height="96" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <rect x="688" y="244" width="56" height="12" rx="2" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8"/>
  <text x="716" y="253" fill="#10b981" font-size="7" class="font-mono" text-anchor="middle">LEAF LEVEL</text>
  <text x="688" y="274" fill="#f8fafc" font-size="12" font-weight="600">Level h: Leaf Nodes Page</text>
  <text x="688" y="292" fill="#10b981" font-size="9" class="font-mono">Doubly Linked List (Prev &lt;-&gt; Next)</text>
  <text x="688" y="310" fill="#94a3b8" font-size="9" class="font-mono">Index Seek: O(log_B N) Traversal</text>

  <!-- Tier 2 Connectors -->
  <!-- From Tier 1 Decision down to Root -->
  <path d="M 820,168 V 188 Q 820,196 812,196 H 178 Q 170,196 170,204 V 228" fill="none" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow-sky)"/>
  <!-- Root to Branch -->
  <line x1="280" y1="284" x2="352" y2="284" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow-sky)"/>
  <!-- Branch to Leaf -->
  <line x1="600" y1="284" x2="672" y2="284" stroke="#38bdf8" stroke-width="1.2" marker-end="url(#arrow-sky)"/>

  <!-- ================= TIER 3: PHYSICAL STORAGE & ACCESS METHODS ================= -->
  <rect x="40" y="376" width="920" height="196" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Zone Label -->
  <rect x="56" y="368" width="364" height="16" rx="2" fill="#0f172a"/>
  <text x="64" y="380" fill="#94a3b8" font-size="8" font-weight="600" class="font-mono" letter-spacing="0.1em">TIER 3: PHYSICAL STORAGE &amp; TABLE ACCESS (DATA BLOCKS)</text>

  <!-- Path A: Clustered Index -->
  <rect x="60" y="408" width="260" height="144" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.2"/>
  <rect x="68" y="416" width="96" height="12" rx="2" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="0.8"/>
  <text x="116" y="425" fill="#10b981" font-size="7" class="font-mono" text-anchor="middle">CLUSTERED INDEX</text>
  <text x="68" y="446" fill="#f8fafc" font-size="13" font-weight="600">Clustered Table (InnoDB)</text>
  <text x="68" y="468" fill="#10b981" font-size="9" class="font-mono">Data Row is IN Leaf Node</text>
  <text x="68" y="488" fill="#94a3b8" font-size="9">Lá Index chính là dòng dữ liệu thật.</text>
  <text x="68" y="508" fill="#94a3b8" font-size="9">Không tốn bước Bookmark Lookup.</text>
  <rect x="68" y="524" width="180" height="18" rx="2" fill="rgba(16,185,129,0.1)"/>
  <text x="76" y="536" fill="#10b981" font-size="8" class="font-mono">Cost: 1 Page Read (Tối ưu nhất)</text>

  <!-- Path B: Secondary Index with Bookmark Lookup (FOCAL BOTTLENECK) -->
  <rect x="360" y="408" width="280" height="144" rx="6" fill="#0f172a" stroke="#f97316" stroke-width="1.4"/>
  <rect x="368" y="416" width="120" height="12" rx="2" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="0.8"/>
  <text x="428" y="425" fill="#f97316" font-size="7" class="font-mono" text-anchor="middle">SECONDARY + LOOKUP</text>
  <text x="368" y="446" fill="#f8fafc" font-size="13" font-weight="600">Secondary (Non-Clustered)</text>
  <text x="368" y="468" fill="#f97316" font-size="9" class="font-mono">Leaf = Key + RowID / PK Pointer</text>
  <text x="368" y="488" fill="#94a3b8" font-size="9">Phát sinh Bookmark Lookup / Random I/O</text>
  <text x="368" y="508" fill="#94a3b8" font-size="9">khi câu SELECT cần cột ngoài Index.</text>
  <rect x="368" y="524" width="232" height="18" rx="2" fill="rgba(249,115,22,0.12)"/>
  <text x="376" y="536" fill="#f97316" font-size="8" class="font-mono">Tử huyệt: &gt;15% row -&gt; Thua Table Scan!</text>

  <!-- Path C: Covering Index -->
  <rect x="680" y="408" width="260" height="144" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1.2"/>
  <rect x="688" y="416" width="104" height="12" rx="2" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="0.8"/>
  <text x="740" y="425" fill="#a855f7" font-size="7" class="font-mono" text-anchor="middle">COVERING INDEX</text>
  <text x="688" y="446" fill="#f8fafc" font-size="13" font-weight="600">Index-Only Scan (Covering)</text>
  <text x="688" y="468" fill="#a855f7" font-size="9" class="font-mono">Mệnh đề INCLUDE (cột bổ sung)</text>
  <text x="688" y="488" fill="#94a3b8" font-size="9">Chứa 100% cột câu SELECT cần.</text>
  <text x="688" y="508" fill="#94a3b8" font-size="9">Triệt tiêu hoàn toàn Bookmark Lookup!</text>
  <rect x="688" y="524" width="188" height="18" rx="2" fill="rgba(168,85,247,0.1)"/>
  <text x="796" y="536" fill="#a855f7" font-size="8" class="font-mono" text-anchor="middle">Zero Table Access (Max Speed)</text>

  <!-- Connectors from Leaf Node to Tier 3 Paths -->
  <!-- To Clustered Path A -->
  <path d="M 720,332 V 356 Q 720,364 712,364 H 200 Q 192,364 192,372 V 400" fill="none" stroke="#10b981" stroke-width="1.2" marker-end="url(#arrow-emerald)"/>
  <!-- To Secondary Path B -->
  <path d="M 810,332 V 356 Q 810,364 802,364 H 508 Q 500,364 500,372 V 400" fill="none" stroke="#f97316" stroke-width="1.4" marker-end="url(#arrow-coral)"/>
  <!-- To Covering Path C -->
  <path d="M 880,332 V 400" fill="none" stroke="#a855f7" stroke-width="1.2" marker-end="url(#arrow-purple)"/>

  <!-- ================= BOTTOM LEGEND STRIP ================= -->
  <line x1="40" y1="592" x2="960" y2="592" stroke="#334155" stroke-width="0.8"/>
  <text x="48" y="620" fill="#64748b" font-size="8" font-weight="600" class="font-mono" letter-spacing="0.12em">LEGEND</text>

  <rect x="120" y="612" width="10" height="10" rx="2" fill="#10b981"/>
  <text x="136" y="621" fill="#cbd5e1" font-size="9" class="font-mono">Clustered / Zero Lookup</text>

  <rect x="330" y="612" width="10" height="10" rx="2" fill="#38bdf8"/>
  <text x="346" y="621" fill="#cbd5e1" font-size="9" class="font-mono">B+Tree Internal Traversal</text>

  <rect x="550" y="612" width="10" height="10" rx="2" fill="#f97316"/>
  <text x="566" y="621" fill="#cbd5e1" font-size="9" class="font-mono">Random I/O Bottleneck (Bookmark Lookup)</text>

  <rect x="830" y="612" width="10" height="10" rx="2" fill="#a855f7"/>
  <text x="846" y="621" fill="#cbd5e1" font-size="9" class="font-mono">Covering Index-Only Scan</text>

</svg>
